name: Build KArchiver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: karchiver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        run: |
          set -e
          if [ -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            SDK=/usr/local/lib/android/sdk
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm /tmp/cmdtools.zip
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-37.0"
          sdkmanager --install "build-tools;37.0.0"
          sdkmanager --install "ndk;28.2.13676358"
          # sdkmanager publishes android-37.0 but AGP resolves compileSdk 37 as android-37
          test -d "$SDK/platforms/android-37.0" || { echo "ERROR: platforms;android-37.0 failed to install into $SDK/platforms" >&2; exit 1; }
          [ -e "$SDK/platforms/android-37" ] || ln -s android-37.0 "$SDK/platforms/android-37"
          test -d "$SDK/platforms/android-37" || { echo "ERROR: SDK platform android-37 missing in $SDK/platforms" >&2; exit 1; }
          ls -d "$SDK"/build-tools/37* > /dev/null || { echo "ERROR: build-tools 37.x missing in $SDK/build-tools" >&2; exit 1; }
          test -d "$SDK/ndk/28.2.13676358" || { echo "ERROR: NDK 28.2.13676358 missing in $SDK/ndk" >&2; exit 1; }

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android target for pinned toolchain
        run: |
          TOOLCHAIN=$(grep -E '^\s*channel\s*=' rust/rust-toolchain.toml | cut -d'"' -f2)
          rustup target add --toolchain "$TOOLCHAIN" aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust .so for all ABIs
        run: |
          cd rust
          cargo ndk -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 --platform 26 -o ../app/src/main/jniLibs build --lib
          ls -la ../app/src/main/jniLibs/armeabi-v7a/ ../app/src/main/jniLibs/arm64-v8a/ ../app/src/main/jniLibs/x86/ ../app/src/main/jniLibs/x86_64/

      - name: Generate throwaway debug keystore
        run: |
          set -e
          export DEBUG_STORE_PASSWORD=$(head -c 48 /dev/urandom | base64 | tr -d '/+=' | head -c 40)
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/karchiver-debug.jks" -alias karchiver-debug \
            -keyalg RSA -keysize 2048 -validity 30 -storetype PKCS12 \
            -storepass:env DEBUG_STORE_PASSWORD -keypass:env DEBUG_STORE_PASSWORD \
            -dname "CN=KArchiver Debug, OU=CI, O=KArchiver, C=US" 2>&1 | tail -2
          {
            echo "KARCHIVER_DEBUG_KEYSTORE=$RUNNER_TEMP/karchiver-debug.jks"
            echo "KARCHIVER_DEBUG_KEY_ALIAS=karchiver-debug"
            echo "KARCHIVER_DEBUG_STORE_PASSWORD=$DEBUG_STORE_PASSWORD"
            echo "KARCHIVER_DEBUG_KEY_PASSWORD=$DEBUG_STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon -x lint --stacktrace

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KARCHIVER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KARCHIVER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KARCHIVER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KARCHIVER_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::release keystore is not configured, release APK skipped"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/karchiver-release.jks"
          {
            echo "KARCHIVER_KEYSTORE=$RUNNER_TEMP/karchiver-release.jks"
            echo "KARCHIVER_STORE_PASSWORD=$STORE_PASSWORD"
            echo "KARCHIVER_KEY_ALIAS=$KEY_ALIAS"
            echo "KARCHIVER_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease --no-daemon -x lint --stacktrace

      - name: Verify signatures
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/37.0.0/apksigner)
          for apk in app/build/outputs/apk/*/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" | grep -E "Verifies|Verified using v2|Signer #1 certificate SHA-256 digest" || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: KArchiver-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: KArchiver-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          compression-level: 0

      - name: APK checksums
        run: |
          {
            echo "### APK checksums"
            echo ""
            echo "| file | bytes | sha256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/*/*.apk; do
            [ -f "$apk" ] || continue
            SIZE=$(stat -c%s "$apk")
            HASH=$(sha256sum "$apk" | cut -d' ' -f1)
            echo "$(basename "$apk"): $SIZE bytes, sha256 $HASH"
            echo "| $(basename "$apk") | $SIZE | \`$HASH\` |" >> "$GITHUB_STEP_SUMMARY"
          done
