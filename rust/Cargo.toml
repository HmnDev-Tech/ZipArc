[package]
name = "karchiver_rs"
version = "0.1.0"
edition = "2024"
description = "KArchiver Rust core: secure archive compress/extract/list"
license = "Apache-2.0"
repository = "https://github.com/sysrv64/KArchiver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", features = ["invocation"] }
zip = { version = "8.6", default-features = false, features = ["deflate", "bzip2", "lzma", "zstd", "aes-crypto"] }
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd", "util", "deflate", "zstd", "lz4"] }
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
zstd = "0.14"
lzma-rust2 = "0.20"
lz4_flex = "0.14"
walkdir = "2.5"
thiserror = "2.0"
rars = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "unwind"
